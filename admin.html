<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP HUAMBO - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 15px; }
        .card { background: #141414; padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        h1 { color: #d4af37; text-align: center; margin: 10px 0; }
        h2 { color: #d4af37; margin-top: 0; font-size: 18px; }
        .btn { background: linear-gradient(135deg, #d4af37, #b8941f); color: #000; padding: 12px; border: none; border-radius: 8px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; letter-spacing: 1px; }
        .btn-verde { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; }
        .btn-vermelho { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-cinza { background: #444; color: white; margin-top: 5px; font-size: 13px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #444; background: #1f1f1f; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #d4af37; }
        .item { background: #1f1f1f; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #d4af37; }
        .item p { margin: 4px 0; font-size: 14px; color: #ddd; }
        .item strong { color: #d4af37; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1f1f1f; color: #999; font-weight: bold; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: linear-gradient(135deg, #d4af37, #b8941f); color: #000; }
        .escondido { display: none; }
        .logo-topo { text-align: center; margin-bottom: 15px; }
        .logo-topo img { max-width: 150px; }
    </style>
</head>
<body>

    <div id="tela-login" class="card">
        <div class="logo-topo">
            <img src="logo.png" alt="TOP HUAMBO">
        </div>
        <h1>PAINEL ADMIN</h1>
        <input type="password" id="senha" placeholder="Digite a senha">
        <button class="btn" onclick="fazerLogin()">ENTRAR</button>
    </div>

    <div id="painel" class="escondido">
        <div class="logo-topo">
            <img src="logo.png" alt="TOP HUAMBO">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('marcacoes', this)">📋 Marcações</button>
            <button class="tab-btn" onclick="mudarAba('servicos', this)">💰 Preços</button>
            <button class="tab-btn" onclick="mudarAba('equipe', this)">👥 Equipe</button>
        </div>

        <div id="aba-marcacoes">
            <div class="card">
                <h2>📊 Resumo</h2>
                <p>Pendentes: <strong id="num-pendentes">0</strong></p>
                <p>Confirmadas: <strong id="num-confirmadas">0</strong></p>
                <p>Ganhos: <strong id="num-ganhos">0 Kz</strong></p>
            </div>
            <div class="card">
                <h2>📋 Lista de Marcações</h2>
                <div id="lista-marcacoes">Carregando...</div>
            </div>
        </div>

        <div id="aba-servicos" class="escondido">
            <div class="card">
                <h2>💰 Alterar Preços</h2>
                <div id="lista-servicos">Carregando...</div>
            </div>
        </div>

        <div id="aba-equipe" class="escondido">
            <div class="card">
                <h2>👥 Adicionar Profissional</h2>
                <input type="text" id="novo-prof" placeholder="Nome do profissional">
                <button class="btn btn-verde" onclick="adicionarProf()">ADICIONAR</button>
            </div>
            <div class="card">
                <h2>👥 Equipe Atual</h2>
                <div id="lista-equipe">Carregando...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfTQkL3syaM-KJZ3NK4YiSfpWFbkdkZWI",
            authDomain: "top-huambo.firebaseapp.com",
            databaseURL: "https://top-huambo-default-rtdb.firebaseio.com",
            projectId: "top-huambo",
            storageBucket: "top-huambo.firebasestorage.app",
            messagingSenderId: "1082034373007",
            appId: "1:1082034373007:web:ede1bc60ee781589348bfa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fazerLogin = function() {
            // ⚠️ Altere a senha aqui se quiser:
            if (document.getElementById('senha').value === "topadmin") {
                document.getElementById('tela-login').classList.add('escondido');
                document.getElementById('painel').classList.remove('escondido');
                carregarTudo();
            } else {
                alert("Senha errada!");
            }
        };

        window.mudarAba = function(aba, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('#painel > div').forEach(d => {
                if (!d.classList.contains('logo-topo')) d.classList.add('escondido');
            });
            document.getElementById('aba-' + aba).classList.remove('escondido');
        };

        function carregarTudo() {
            carregarMarcacoes();
            carregarServicos();
            carregarEquipe();
        }

        function carregarMarcacoes() {
            const div = document.getElementById('lista-marcacoes');
            onValue(ref(db, 'marcacoes'), (snapshot) => {
                div.innerHTML = '';
                let pend = 0, conf = 0, ganhos = 0;
                
                if (!snapshot.exists()) {
                    div.innerHTML = '<p style="color:#999;">Nenhuma marcação.</p>';
                    return;
                }

                snapshot.forEach((child) => {
                    const m = child.val();
                    const id = child.key;
                    
                    if (m.status === 'pendente') pend++;
                    if (m.status === 'confirmada') { conf++; ganhos += parseInt(m.total || 0); }

                    div.innerHTML += `
                        <div class="item">
                            <p><strong>Cliente:</strong> ${m.cliente} (${m.telefone})</p>
                            <p><strong>Endereço:</strong> ${m.endereco || 'Não informado'}</p>
                            <p><strong>Serviço:</strong> ${m.servico}</p>
                            <p><strong>Profissional:</strong> ${m.profissional}</p>
                            <p><strong>Data:</strong> ${m.data} às ${m.hora}</p>
                            <p><strong>Total:</strong> ${m.total} Kz | <strong>Estado:</strong> ${m.status}</p>
                            
                            ${m.status === 'pendente' ? `<button class="btn btn-verde" onclick="mudarStatus('${id}', 'confirmada')">✅ CONFIRMAR</button>` : ''}
                            ${m.status === 'pendente' ? `<button class="btn btn-vermelho" onclick="mudarStatus('${id}', 'cancelada')">❌ CANCELAR</button>` : ''}
                            
                            <button class="btn btn-cinza" onclick="apagarMarcacao('${id}')">🗑️ APAGAR REGISTO</button>
                        </div>
                    `;
                });
                
                document.getElementById('num-pendentes').innerText = pend;
                document.getElementById('num-confirmadas').innerText = conf;
                document.getElementById('num-ganhos').innerText = ganhos + " Kz";
            });
        }

        window.mudarStatus = function(id, status) {
            update(ref(db, 'marcacoes/' + id), { status: status });
        };

        window.apagarMarcacao = function(id) {
            if (confirm("⚠️ Tem certeza que deseja APAGAR esta marcação? Esta ação não pode ser desfeita.")) {
                remove(ref(db, 'marcacoes/' + id)).then(() => {
                    alert("🗑️ Marcação apagada com sucesso!");
                }).catch((error) => {
                    alert("Erro ao apagar: " + error.message);
                });
            }
        };

        function carregarServicos() {
            const div = document.getElementById('lista-servicos');
            onValue(ref(db, 'servicos'), (snapshot) => {
                div.innerHTML = '';
                if (!snapshot.exists()) {
                    div.innerHTML = '<p style="color:#999;">Nenhum serviço. Adicione no Firebase.</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    const s = child.val();
                    const id = child.key;
                    div.innerHTML += `
                        <div class="item">
                            <p><strong>${s.nome}</strong></p>
                            <input type="number" id="preco-${id}" value="${s.preco}" placeholder="Preço">
                            <button class="btn btn-verde" onclick="salvarPreco('${id}')">SALVAR PREÇO</button>
                        </div>
                    `;
                });
            });
        }

        window.salvarPreco = function(id) {
            const novoPreco = parseInt(document.getElementById('preco-' + id).value);
            update(ref(db, 'servicos/' + id), { preco: novoPreco }).then(() => alert("Preço atualizado!"));
        };

        function carregarEquipe() {
            const div = document.getElementById('lista-equipe');
            onValue(ref(db, 'profissionais'), (snapshot) => {
                div.innerHTML = '';
                if (!snapshot.exists()) {
                    div.innerHTML = '<p style="color:#999;">Nenhum profissional. Adicione acima.</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    const p = child.val();
                    const id = child.key;
                    div.innerHTML += `
                        <div class="item">
                            <p><strong>${p.nome}</strong> ${p.ativo ? '✅' : '❌'}</p>
                            <button class="btn btn-vermelho" onclick="apagarProf('${id}')">APAGAR</button>
                        </div>
                    `;
                });
            });
        }

        window.adicionarProf = function() {
            const nome = document.getElementById('novo-prof').value;
            if (!nome) return alert("Digite o nome!");
            set(push(ref(db, 'profissionais')), { nome: nome, ativo: true }).then(() => {
                alert("Adicionado!");
                document.getElementById('novo-prof').value = '';
            });
        };

        window.apagarProf = function(id) {
            if (confirm("Apagar profissional?")) {
                remove(ref(db, 'profissionais/' + id));
            }
        };
    </script>
</body>
</html>
